# ============================================================
# PART 2b: rebrand pass over the newly written files
#
# translations.ts is generated from the original file, so it is
# written with the old brand name and has to be swept again.
# Everything else here is already correct, so this is a no-op
# for the other files.
# ============================================================

echo "==> Second rebrand pass over written files"

FILES2=$(grep -rl -e 'Triiosan' -e 'TRIIOSAN' -e 'triiosan' -e '\bember\b' \
  --include='*.ts' --include='*.tsx' --include='*.js' \
  --include='*.css' --include='*.json' --include='*.sql' \
  . 2>/dev/null | grep -v node_modules | grep -v '\.next/' | grep -v '\.phase1-backup/' || true)

for f in $FILES2; do
  sed -i \
    -e 's/TRIIOSAN/TETRADCARE/g' \
    -e 's/Triiosan/TetradCare/g' \
    -e 's/triiosan/tetradcare/g' \
    "$f"
  sed -i -E 's/\bember\b/teal/g' "$f"
done

# ============================================================
# PART 3: what is left
# ============================================================

echo
echo "==> Self-check"
LEFT=$(grep -rli 'triiosan' src package.json tailwind.config.js 2>/dev/null | grep -v node_modules || true)
if [ -n "$LEFT" ]; then
  echo "    WARNING: brand name still present in:"
  echo "$LEFT" | sed 's/^/      /'
else
  echo "    brand name: clean"
fi
for req in src/lib/cases/status.ts supabase/migrations/002_scheduling.sql \
           supabase/migrations/003_rls.sql src/components/AppointmentForm.tsx; do
  [ -f "$req" ] && echo "    $req: ok" || echo "    $req: MISSING"
done
echo
echo "================================================================"
echo "Done. Backup of the originals is in .phase1-backup/"
echo
echo "STILL TO DO, IN ORDER:"
echo
echo "  1. Supabase SQL Editor, in this order:"
echo "       supabase/migrations/002_scheduling.sql"
echo "       supabase/migrations/003_rls.sql"
echo "       supabase/seed/ikorodu.sql   <- EDIT THE CLINIC HOURS FIRST"
echo
echo "  2. Sign in as a test patient and run:"
echo "       select ai_clinician_summary from triage_cases limit 1;"
echo "     Zero rows or an error is correct. If it returns text, STOP."
echo
echo "  3. npm install && npm run build"
echo
echo "  4. Update the AppointmentForm caller if you changed it since:"
