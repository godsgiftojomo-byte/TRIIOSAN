name: Apply Phase 1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Confirm the installer arrived intact
        run: |
          if [ ! -f apply-phase1.sh ]; then
            echo "::error::apply-phase1.sh is not in the repo root."
            exit 1
          fi
          SIZE=$(wc -c < apply-phase1.sh)
          echo "apply-phase1.sh is $SIZE bytes"
          if [ "$SIZE" -lt 150000 ]; then
            echo "::error::File looks truncated. Expected about 164077 bytes, got $SIZE."
            exit 1
          fi

      - name: Run the installer
        run: bash apply-phase1.sh

      - name: Show what changed
        run: |
          git status --short
          echo "---"
          git diff --stat

      - name: Commit to the phase-1 branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b phase-1
          rm -rf .phase1-backup
          rm -f rebrand.sh
          git add -A
          git commit -m "Phase 1: rebrand to TetradCare, slot-based scheduling, RLS"
          git push --force origin phase-1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          GOOGLE_GENERATIVE_AI_API_KEY: placeholder
          GEMINI_API_KEY: placeholder
        run: npm run build

      - name: Result
        if: always()
        run: |
          echo "Your code is on the phase-1 branch either way."
          echo "If Build is red, open it and read the error."
