#!/usr/bin/env bash
#
# TetradCare Phase 1: one-shot installer.
#
# Everything in one file so you only paste once. It will:
#   1. rebrand TRIIOSAN -> TetradCare and orange -> teal
#   2. write all 16 Phase 1 files into place
#   3. tell you what is left to do by hand
#
# RUN FROM THE REPO ROOT:
#   bash apply-phase1.sh
#
# Commit first. This edits and overwrites files.

set -euo pipefail

if [ ! -f package.json ]; then
  echo "Run this from the repo root (no package.json here)."
  exit 1
fi

echo "==> Backing up to .phase1-backup/"
rm -rf .phase1-backup
mkdir -p .phase1-backup
cp -r src package.json tailwind.config.js .phase1-backup/ 2>/dev/null || true

# ============================================================
# PART 1: rebrand
# ============================================================

echo "==> Rebranding"

FILES=$(grep -rl -e 'Triiosan' -e 'TRIIOSAN' -e 'triiosan' -e '\bember\b' \
  --include='*.ts' --include='*.tsx' --include='*.js' \
  --include='*.css' --include='*.json' --include='*.sql' \
  . 2>/dev/null | grep -v node_modules | grep -v '\.next/' | grep -v '\.phase1-backup/' || true)

for f in $FILES; do
  sed -i \
    -e 's/TRIIOSAN/TETRADCARE/g' \
    -e 's/Triiosan/TetradCare/g' \
    -e 's/triiosan/tetradcare/g' \
    "$f"
  # \bember\b does not match "remember" or "September".
  sed -i -E 's/\bember\b/teal/g' "$f"
  sed -i \
    -e 's/#E8622D/#0F7285/g' \
    -e 's/#C44818/#0B5665/g' \
    -e 's/#F08050/#2E97AB/g' \
    -e 's/#FBF6F0/#F2F7F8/g' \
    "$f"
  sed -i -E \
    -e 's/(--color-teal-dark:[[:space:]]*)196 72 24;/\111 86 101;/' \
    -e 's/(--color-teal:[[:space:]]*)232 98 45;/\115 114 133;/' \
    -e 's/(--color-cream:[[:space:]]*)251 246 240;/\1242 247 248;/' \
    "$f"
done

# Folder holds Google Gemini code, not Anthropic.
if [ -d src/lib/anthropic ]; then
  echo "==> Renaming src/lib/anthropic -> src/lib/ai"
  if command -v git >/dev/null && git rev-parse --git-dir >/dev/null 2>&1; then
    git mv src/lib/anthropic src/lib/ai
  else
    mv src/lib/anthropic src/lib/ai
  fi
  grep -rl "lib/anthropic" src 2>/dev/null | xargs -r sed -i 's|lib/anthropic|lib/ai|g'
fi

# ============================================================
# PART 2: write the Phase 1 files
# ============================================================

echo "==> Writing Phase 1 files"

mkdir -p "supabase/migrations"
echo "    supabase/migrations/002_scheduling.sql"
